name: Sync workshop schedule & archive

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync workshops from the published sheet(s)
        run: node scripts/sync-workshops.js

      - name: Commit changes if any
        run: |
          if git diff --quiet -- data/workshops.json data/link-title-cache.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "teacher-studio-bot"
          git config user.email "actions@github.com"
          git add data/workshops.json data/link-title-cache.json
          git commit -m "Sync workshop schedule & archive"
          git push

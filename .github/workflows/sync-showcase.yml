name: Sync Show & Tell photos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync approved photos from the response sheet
        run: node scripts/sync-showcase.js

      - name: Commit changes if any
        run: |
          if git diff --quiet -- data/showcase.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "teacher-studio-bot"
          git config user.email "actions@github.com"
          git add data/showcase.json
          git commit -m "Sync approved Show & Tell photos"
          git pull --rebase origin main
          git push

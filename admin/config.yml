backend:
  name: github
  repo: uw-pkir/teacher-studio
  branch: main
  base_url: https://teacher-studio-cms-auth.kirschmann.workers.dev

# Matches where organizer photos (and every other site image) actually
# live -- if this doesn't match, the image widget shows a broken preview
# for anything not uploaded through the CMS itself, and the Media Library
# can't find those files either.
media_folder: "images"
public_folder: "images"

collections:
  - name: "content"
    label: "Hubs & Organizers"
    files:
      # Workshops (the Next Workshop banner, the schedule grid, and the
      # resource archive) are no longer edited here — they're entirely
      # driven by the published Google Sheets set up under Settings ->
      # Google Sheet Links. See SETUP.md.
      - name: "hubs"
        label: "Hub Sites / Organizing Partners"
        file: "data/hubs.json"
        description: "Shown on the map (and the text list below it) and used to build the Partner Organizations list automatically."
        fields:
          - label: "Hubs"
            name: "hubs"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} — {{fields.location}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "City, State", name: "location", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Website", name: "website", widget: "string" }
              - { label: "Hub? (a gathering location -- shown as a pin on the map and in the text list of hub sites)", name: "is_hub", widget: "boolean", default: true }
              - { label: "Organizing Partner? (shown in the Partner Organizations list at the bottom -- independent of Hub, since some entries are one, the other, or both)", name: "is_partner", widget: "boolean", default: true }
              - { label: "Street Address (only used if this is a hub — a robot turns this into a map pin automatically within a minute or two of saving)", name: "address", widget: "string", required: false }
              - { label: "Latitude (auto-filled from the Street Address above once saved — leave blank)", name: "lat", widget: "number", value_type: "float", required: false }
              - { label: "Longitude (auto-filled from the Street Address above once saved — leave blank)", name: "lng", widget: "number", value_type: "float", required: false }

      - name: "organizers"
        label: "Organizers"
        file: "data/organizers.json"
        fields:
          - label: "Current Organizers"
            name: "organizers"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} — {{fields.org}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Organization", name: "org", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
          - label: "Organizers Emeriti (past organizers, shown as plain names below the current team)"
            name: "emeriti"
            widget: "list"

  - name: "section_text"
    label: "Update Section Text"
    files:
      - name: "section_text"
        label: "Section Headlines & Descriptions"
        file: "data/section-text.json"
        description: "The headline and description shown at the top of each section of the site. (The small label above each headline, like \"Hubs\" or \"Organizers\", isn't editable here.) Click a section below to expand it."
        fields:
          - label: "Hero (top of the homepage)"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Headline", name: "headline", widget: "string", hint: "Put a single asterisk on either side of a word to highlight it in color, e.g. \"Where Educators *Make* & *Learn* Together\"." }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Primary button label", name: "cta_primary_label", widget: "string", required: false, hint: "Links to the Next Workshop section." }
              - { label: "Secondary button label", name: "cta_secondary_label", widget: "string", required: false, hint: "Links to the About Us section." }
          - label: "Schedule"
            name: "schedule"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Description", name: "description", widget: "text", hint: "Include the token {{time}} wherever the workshop time (set in Settings -> General Settings) should be inserted, e.g. \"...on Thursdays{{time}} — topics are...\"." }
          - label: "Show & Tell"
            name: "gallery"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Submission prompt (shown above the Submit a Project button)", name: "submit_intro", widget: "string", required: false }
              - { label: "Submission note (shown just below the prompt)", name: "submit_note", widget: "string", required: false }
          - label: "Past Workshops (Resource Archive)"
            name: "resources"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "About Us"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Icon/title/description rows"
                name: "features"
                widget: "list"
                collapsed: true
                summary: "{{fields.title}}"
                fields:
                  - { label: "Icon (an emoji)", name: "icon", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Hubs"
            name: "hubs"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Organizers"
            name: "team"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Footer"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Tagline", name: "tagline", widget: "string", required: false }
              - { label: "Contact email", name: "contact_email", widget: "string", required: false, hint: "Just the address, e.g. wardrip@wisc.edu -- the \"Questions? Contact Us\" wording around it isn't editable here." }

  - name: "settings"
    label: "Settings"
    description: "Handy link -- Website Entry form: https://forms.gle/ST8NH8y8HczTDKbb8 (fill this out to submit a new workshop each month; it's what feeds the Workshops sheet below). The Show & Tell approval sheet's link isn't listed here since this file is publicly fetchable -- see the organizer reference doc instead."
    files:
      - name: "settings"
        label: "General Settings"
        file: "data/site-settings.json"
        description: "Registration, timing, and location details -- safe to update any time."
        fields:
          - { label: "Workshop time (same for every workshop)", name: "workshop_time", widget: "string", hint: "e.g. 4:30-5:30 PM CST" }
          - { label: "Registration link (Google Form URL)", name: "register_url", widget: "string" }
          - { label: "Location note", name: "location_note", widget: "text" }
          - { label: "Show & Tell submission form (Google Form URL)", name: "show_tell_form_url", widget: "string" }

      - name: "sync_settings"
        label: "Google Sheet Links (Advanced)"
        file: "data/sync-settings.json"
        description: "Technical plumbing for the workshop schedule and Show & Tell pipelines -- set up once (see SETUP.md) and rarely touched again. Only change these if you're replacing which Google Sheet the site pulls from."
        fields:
          - { label: "Workshops sheet (published TSV URL — see SETUP.md)", name: "workshops_tsv_url", widget: "string" }
          - { label: "Season dates sheet (published TSV URL, optional — see SETUP.md)", name: "season_dates_tsv_url", widget: "string", required: false }
          - { label: "Show & Tell published CSV URL (from the response sheet's 'Public' tab — see SETUP.md)", name: "show_tell_csv_url", widget: "string", required: false }
